<input id="num1" type="number" /> <input id="num2" type="number" />

// Button is waiting for a userclick to trigger the calculate function
<button onclick="calculate()">add</button>
<p id="result"></p>

<script>
  // Finding and selecting input box 1 & 2
  var num1 = document.getElementById("num1");
  var num2 = document.getElementById("num2");

  // Finding and selecting electing result id holding element
  var result = document.getElementById("result");

  // Getting vales from input box using num1.value
  function calculate() {
    // Just to see the values got //
    //console.log(num1.value);//
    //console.log(num2.value);//

    // Reads then grab values inside input boxes and store it in a variable
    // Then converts the values into number as by default it is string datatype
    var num1value = Number(num1.value);
    var num2value = Number(num2.value);

    // Adding and storing both vales
    var sum = num1value + num2value;

    // Display sum in result element //
    result.textContent = "Result: " + sum;
  }
</script>

<!-- Notes We cant take text from an input box but instead a value can be taken -->
